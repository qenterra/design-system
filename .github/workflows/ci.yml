name: Design System verification

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          lfs: true
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
      - name: Install verification dependencies
        run: |
          python3 -m venv "$RUNNER_TEMP/design-system-images"
          "$RUNNER_TEMP/design-system-images/bin/python" -m pip install -r requirements-visual.txt
      - name: Run complete gate
        env:
          DESIGN_SYSTEM_IMAGE_PYTHON: ${{ runner.temp }}/design-system-images/bin/python
        run: python3 scripts/verify.py
