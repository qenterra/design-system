name: Design System verification

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          lfs: true
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Install verification dependencies
        run: |
          npm ci --ignore-scripts --cache "$RUNNER_TEMP/npm-cache"
          python3 -m venv "$RUNNER_TEMP/design-system-images"
          "$RUNNER_TEMP/design-system-images/bin/python" -m pip install -r requirements-visual.txt
      - name: Run complete gate
        env:
          DESIGN_SYSTEM_IMAGE_PYTHON: ${{ runner.temp }}/design-system-images/bin/python
        run: python3 scripts/verify.py
