name: Design System verification

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "17 5 * * 1"

permissions:
  contents: read

jobs:
  explore-swiftui-currentness:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Compare the stored catalog with Explore SwiftUI
        run: python3 scripts/explore_swiftui.py sync --check

  verify:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          lfs: true
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .nvmrc
      - name: Install verification dependencies
        run: |
          python3 -m venv "$RUNNER_TEMP/design-system-images"
          "$RUNNER_TEMP/design-system-images/bin/python" -m pip install -r requirements-visual.txt
      - name: Run complete gate
        env:
          DESIGN_SYSTEM_IMAGE_PYTHON: ${{ runner.temp }}/design-system-images/bin/python
        run: python3 scripts/verify.py
