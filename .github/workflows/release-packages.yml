name: Release public packages

on:
  workflow_dispatch:
    inputs:
      publish:
        description: Publish the verified snapshot
        required: true
        default: false
        type: boolean
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: read

concurrency:
  group: design-system-public-packages-${{ github.ref }}
  cancel-in-progress: false

jobs:
  snapshot:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          lfs: true
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .nvmrc
      - name: Require tag and version alignment
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        run: |
          version=$(tr -d '[:space:]' < VERSION)
          test "$GITHUB_REF_NAME" = "v$version"
      - name: Install verification dependencies
        run: |
          python3 -m venv "$RUNNER_TEMP/design-system-images"
          "$RUNNER_TEMP/design-system-images/bin/python" -m pip install -r requirements-visual.txt
      - name: Verify private source and public boundary
        env:
          DESIGN_SYSTEM_IMAGE_PYTHON: ${{ runner.temp }}/design-system-images/bin/python
        run: python3 scripts/verify.py
      - name: Export allowlisted public snapshot
        run: python3 scripts/build_public_packages.py export --destination "$RUNNER_TEMP/public-packages"
      - name: Verify exported snapshot
        run: python3 "$RUNNER_TEMP/public-packages/scripts/verify_release.py"
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: public-packages-${{ github.run_id }}
          path: ${{ runner.temp }}/public-packages
          if-no-files-found: error
          retention-days: 7

  publish:
    needs: snapshot
    if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.publish)
    runs-on: macos-15
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v6
        with:
          name: public-packages-${{ github.run_id }}
          path: snapshot
      - name: Check out public repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: qenterra/packages
          token: ${{ secrets.PACKAGES_REPO_TOKEN }}
          path: public-repository
          fetch-depth: 0
      - name: Update public repository from snapshot only
        shell: bash
        working-directory: public-repository
        run: |
          git rm -r --ignore-unmatch .
          rsync -a --exclude .git ../snapshot/ ./
          git add --all
          version=$(python3 -c 'import json; print(json.load(open("release-manifest.json"))["version"])')
          git -c user.name='QenTerra Release' -c user.email='contact@qenterra.com' commit -m "chore(release): publish $version" || true
          existing=$(git rev-parse -q --verify "refs/tags/v$version" || true)
          if test -n "$existing"; then test "$existing" = "$(git rev-parse HEAD)"; else git tag -a "v$version" -m "Release $version"; fi
          git push origin HEAD:main "refs/tags/v$version"
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "22"
          registry-url: https://registry.npmjs.org
          scope: "@qenterra"
      - name: Publish or verify npm package
        working-directory: public-repository
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        shell: bash
        run: |
          version=$(python3 -c 'import json; print(json.load(open("npm/design-tokens/package.json"))["version"])')
          local_json=$(npm pack --workspace @qenterra/design-tokens --pack-destination "$RUNNER_TEMP" --json)
          local_integrity=$(printf '%s' "$local_json" | python3 -c 'import json,sys; print(json.load(sys.stdin)[0]["integrity"])')
          remote_integrity=$(npm view "@qenterra/design-tokens@$version" dist.integrity 2>/dev/null || true)
          if test -n "$remote_integrity"; then test "$remote_integrity" = "$local_integrity"; else npm publish --workspace @qenterra/design-tokens --access public; fi
