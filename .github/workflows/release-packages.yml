name: Release public packages

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing version tag to publish
        required: true
        type: string
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: read

concurrency:
  group: design-system-public-packages-${{ github.ref }}
  cancel-in-progress: false

jobs:
  snapshot:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          lfs: true
          persist-credentials: false
          ref: ${{ github.event_name == 'workflow_dispatch' && format('refs/tags/{0}', inputs.release_tag) || github.ref }}
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
      - name: Require tag and version alignment
        shell: bash
        env:
          RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.release_tag || github.ref_name }}
        run: |
          version=$(tr -d '[:space:]' < VERSION)
          test "$RELEASE_TAG" = "v$version"
          git show-ref --verify --quiet "refs/tags/$RELEASE_TAG"
          test "$(git rev-parse HEAD)" = "$(git rev-list -n 1 "$RELEASE_TAG")"
      - name: Install verification dependencies
        run: |
          python3 -m venv "$RUNNER_TEMP/design-system-images"
          "$RUNNER_TEMP/design-system-images/bin/python" -m pip install -r requirements-visual.txt
      - name: Verify source and package boundary
        env:
          DESIGN_SYSTEM_IMAGE_PYTHON: ${{ runner.temp }}/design-system-images/bin/python
        run: python3 scripts/verify.py
      - name: Export allowlisted package snapshot
        run: python3 scripts/build_public_packages.py export --destination "$RUNNER_TEMP/public-packages"
      - name: Verify exported snapshot
        run: python3 "$RUNNER_TEMP/public-packages/scripts/verify_release.py"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: public-packages-${{ github.run_id }}
          path: ${{ runner.temp }}/public-packages
          if-no-files-found: error
          retention-days: 7

  publish:
    needs: snapshot
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v'))
    permissions:
      contents: read
      id-token: write
    runs-on: macos-26
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: public-packages-${{ github.run_id }}
          path: snapshot
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22.14.0"
          registry-url: https://registry.npmjs.org
          scope: "@qenterra"
      - name: Pin trusted-publishing toolchain
        shell: bash
        run: |
          npm install --global npm@11.5.1
          test "$(node --version)" = "v22.14.0"
          test "$(npm --version)" = "11.5.1"
      - name: Publish or verify npm package
        working-directory: snapshot
        shell: bash
        run: |
          version=$(python3 -c 'import json; print(json.load(open("npm/design-tokens/package.json"))["version"])')
          local_json=$(npm pack --workspace @qenterra/design-tokens --pack-destination "$RUNNER_TEMP" --json)
          local_integrity=$(printf '%s' "$local_json" | python3 -c 'import json,sys; print(json.load(sys.stdin)[0]["integrity"])')
          remote_integrity=$(npm view "@qenterra/design-tokens@$version" dist.integrity 2>/dev/null || true)
          if test -n "$remote_integrity"; then test "$remote_integrity" = "$local_integrity"; else npm publish --workspace @qenterra/design-tokens --access public --tag latest; fi
