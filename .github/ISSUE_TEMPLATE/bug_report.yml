name: Bug report
description: Report a reproducible Design System problem
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Search existing issues first. Report vulnerabilities through GitHub private vulnerability reporting, not here.
  - type: input
    id: version
    attributes:
      label: Design System version or commit
      placeholder: "1.12.0 or 17fe931"
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Environment
      description: Include relevant macOS, Xcode, Swift, Node.js, Python, or browser versions.
      placeholder: "macOS 27, Xcode 27, Swift 6.4"
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Reproduction steps
      placeholder: |
        1. Run …
        2. Open …
        3. Observe …
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Screenshots, video, or logs
      description: Replace accounts, product content, filenames, paths, and credentials with synthetic values.
  - type: checkboxes
    id: checks
    attributes:
      label: Checks
      options:
        - label: I reproduced this on the latest supported release or current main branch.
          required: true
        - label: This report contains no vulnerability, credential, customer data, or private consumer source.
          required: true
