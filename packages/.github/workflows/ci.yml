name: Public packages

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "22"
      - name: Verify generated outputs and release manifest
        run: python3 scripts/verify_release.py
      - name: Inspect npm package
        run: npm pack --workspace @qenterra/design-tokens --dry-run --json --cache "$RUNNER_TEMP/npm-cache"
      - name: Test Swift package
        run: swift test --scratch-path "$RUNNER_TEMP/swift-build" --disable-sandbox
